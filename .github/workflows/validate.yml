name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check Markdown links
        run: node scripts/check-links.mjs
      - name: Verify exercises fail as shipped and pass with solutions
        run: node scripts/verify-exercises.mjs
      - name: Test the learner helper scripts
        run: node --test scripts/test-bin.mjs
      - name: Validate plugin, skills, and agents
        run: npx --yes @anthropic-ai/claude-code@2.1.314 plugin validate --strict .
      - name: Check learner data is gitignored
        run: grep -qxF '.codeops/' .gitignore
